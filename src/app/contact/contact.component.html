<section id="contact" class="text-gray-300 bg-gray-900 body-font relative">
  <div class="container px-5 py-24 mx-auto">
    <!-- Header Section -->
    <div class="flex flex-col text-center w-full mb-12">
      <h1 class="sm:text-3xl text-2xl font-medium title-font mb-4 text-white">
        Get in Touch
      </h1>
      <p class="lg:w-2/3 mx-auto leading-relaxed text-base text-gray-400">
        I'd love to hear from you. Please fill out the form below to send me a message.
      </p>
    </div>

    <!-- Form Section -->
    <div class="lg:w-1/2 md:w-2/3 mx-auto">
      <div class="flex flex-wrap -m-2">
        <!-- Name Input -->
        <div class="p-2 w-1/2">
          <div class="relative">
            <label for="name" class="leading-7 text-sm text-gray-400">Name</label>
            <input 
              type="text" 
              id="name" 
              name="Name"
              [(ngModel)]="contactobj.Name"
              required 
              #name="ngModel"
              class="w-full bg-gray-800 rounded border border-gray-700 focus:border-indigo-500 focus:bg-gray-900 focus:ring-2 focus:ring-indigo-900 text-base outline-none text-gray-100 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out">
          </div>
        </div>

        <!-- Email Input -->
        <div class="p-2 w-1/2">
          <div class="relative">
            <label for="email" class="leading-7 text-sm text-gray-400">Email</label>
            <input 
              type="email" 
              id="email" 
              name="Email"
              [(ngModel)]="contactobj.Email"
              required
              #email="ngModel"
              class="w-full bg-gray-800 rounded border border-gray-700 focus:border-indigo-500 focus:bg-gray-900 focus:ring-2 focus:ring-indigo-900 text-base outline-none text-gray-100 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out">
          </div>
        </div>

        <!-- Message Input -->
        <div class="p-2 w-full">
          <div class="relative">
            <label for="message" class="leading-7 text-sm text-gray-400">Message</label>
            <textarea 
              id="message" 
              name="Message"
              [(ngModel)]="contactobj.Message"
              required
              #message="ngModel"
              class="w-full bg-gray-800 rounded border border-gray-700 focus:border-indigo-500 focus:bg-gray-900 focus:ring-2 focus:ring-indigo-900 h-32 text-base outline-none text-gray-100 py-1 px-3 resize-none leading-6 transition-colors duration-200 ease-in-out"></textarea>
          </div>
        </div>

        <!-- Submit Button -->
        <div class="p-2 w-full">
          <button 
            (click)="sendMessage()" 
            [disabled]="!name.valid || !email.valid || !message.valid"
            class="flex mx-auto text-white bg-indigo-600 border-0 py-2 px-8 focus:outline-none hover:bg-indigo-700 rounded text-lg">
            Send Message
          </button>
        </div>
      </div>
    </div>
  </div>
</section>

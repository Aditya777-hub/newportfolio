<section class="text-gray-300 bg-gray-900 body-font">
  <div class="container mx-auto flex px-5 py-24 md:flex-row flex-col items-center">
    <div
      class="lg:flex-grow md:w-1/2 lg:pr-24 md:pr-16 flex flex-col md:items-start md:text-left mb-16 md:mb-0 items-center text-center animate-fade-in-left">
      <h1 class="title-font sm:text-4xl text-3xl mb-4 font-medium text-white animate-slide-up">Welcome, I'm Aditya Gade</h1>
      <h2 class="text-xl mb-4 font-medium text-white animate-slide-up animation-delay-200">Angular Developer</h2>
      <p class="mb-8 leading-relaxed text-gray-300 animate-fade-in animation-delay-400">Highly motivated and detail-oriented Angular developer with a passion for building
        scalable and efficient applications.</p>
      <div class="flex w-full md:justify-start justify-center items-end animate-bounce animation-delay-600">
        <button (click)="navigate()"
          class="inline-flex text-white bg-indigo-600 border-0 py-2 px-6 focus:outline-none hover:bg-indigo-700 rounded text-lg transition-all duration-300 ease-in-out hover:scale-105">Get
          in Touch</button>
      </div>
      <p class="text-sm mt-2 text-gray-400 mb-8 w-full animate-fade-in animation-delay-800">Let's build something amazing together!</p>
    </div>
    <div class="lg:max-w-lg lg:w-full md:w-1/2 w-5/6 animate-fade-in-right">
      <img class="object-cover object-center rounded hover:scale-105 transition-transform duration-300" alt="hero"
        src="https://images.unsplash.com/photo-1488590528505-98d2b5aba04b?fm=jpg&q=60&w=3000&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8dGVjaG5vbG9neXxlbnwwfHwwfHx8MA%3D%3D">
    </div>
  </div>
